<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>AI Image Classifier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: "Pretendard", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .app {
      background: #ffffff;
      width: 360px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }

    .start-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .webcam-wrapper {
      margin: 20px 0;
      display: flex;
      justify-content: center;
    }

    canvas {
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .labels {
      margin-top: 16px;
      text-align: left;
    }

    .label-item {
      margin-bottom: 12px;
    }

    .label-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: #eee;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      transition: width 0.2s ease;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="title">AI Image Classifier</div>
    <div class="subtitle">Teachable Machine 기반 실시간 분류</div>

    <button class="start-btn" onclick="init()">카메라 시작</button>

    <div class="webcam-wrapper" id="webcam-container"></div>
    <div class="labels" id="label-container"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <script>
    const URL = "./my_model/";

    let model, webcam, labelContainer, maxPredictions;

    async function init() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      webcam = new tmImage.Webcam(240, 240, true);
      await webcam.setup();
      await webcam.play();
      window.requestAnimationFrame(loop);

      document.getElementById("webcam-container").appendChild(webcam.canvas);

      labelContainer = document.getElementById("label-container");
      labelContainer.innerHTML = "";

      for (let i = 0; i < maxPredictions; i++) {
        const item = document.createElement("div");
        item.className = "label-item";
        item.innerHTML = `
          <div class="label-name">${model.getClassLabels()[i]}</div>
          <div class="progress">
            <div class="progress-bar"></div>
          </div>
        `;
        labelContainer.appendChild(item);
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      const items = document.querySelectorAll(".label-item");

      prediction.forEach((p, i) => {
        const bar = items[i].querySelector(".progress-bar");
        bar.style.width = `${(p.probability * 100).toFixed(1)}%`;
      });
    }
  </script>
</body>
</html>
